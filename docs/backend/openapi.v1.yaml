# LabelScan API — OpenAPI 3.1 SKELETON
# Status: Partially implemented — see BACKEND-ARCHITECTURE.md §8 for implemented vs planned endpoints.
# Companion to BACKEND-ARCHITECTURE.md and API-CONTRACTS.md. Paths + components only.
# Request/response detail and examples live in API-CONTRACTS.md; keep all three in sync.
openapi: 3.1.0
info:
  title: LabelScan Backend API
  version: "1.0.0"
  description: >
    HACCP-oriented seafood traceability backend. Modular monolith, hexagonal core.
    Raw stored before normalization; append-only audit; confidence+provenance per field;
    unknown fields are null (never fabricated). See BACKEND-ARCHITECTURE.md.
    Implementation notes: HS256 JWT auth, claude-haiku-4-5 default LLM,
    hybrid GS1+LLM extraction, extracted_field.source ∈ {llm,gs1,human}.
servers:
  - url: https://api.labelscan.example/v1
    description: placeholder

security:
  - bearerAuth: []

tags:
  - { name: identity,     description: "Authentication and admin-only user/store management" }
  - { name: ingestion,    description: "Capability 1-4: label ingestion, OCR/extraction, review" }
  - { name: traceability, description: "Capability 5-7: batches, suppliers, lookup" }
  - { name: haccp,        description: "Capability 8-9: temperature logs, alerts" }
  - { name: audit,        description: "Capability 10: append-only audit (read-only)" }
  - { name: ops,          description: "health, version" }

paths:
  # ---- Identity / RBAC ---------------------------------------------------------------
  /auth/login:
    post:
      tags: [identity]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /o/{organization_slug}/auth/login:
    post:
      tags: [identity]
      operationId: loginOrganization
      security: []
      parameters:
        - { name: organization_slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /mobile/auth/login:
    post:
      tags: [identity]
      operationId: loginMobileOperator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Store operator authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users:
    post:
      tags: [identity]
      operationId: createUser
      security: [{ bearerAuth: ["identity:admin"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: USER_ALREADY_EXISTS, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      tags: [identity]
      operationId: listUsers
      security: [{ bearerAuth: ["identity:admin"] }]
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/UserRole' } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: store_code, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - $ref: '#/components/parameters/Limit'
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}:
    patch:
      tags: [identity]
      operationId: updateUser
      security: [{ bearerAuth: ["identity:admin"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: LAST_ACTIVE_ADMIN or SELF_ACCESS_CHANGE_NOT_ALLOWED, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      tags: [identity]
      operationId: deleteUser
      summary: Reversibly deactivate an account
      security: [{ bearerAuth: ["identity:admin"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Deactivated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: LAST_ACTIVE_ADMIN or SELF_ACCESS_CHANGE_NOT_ALLOWED, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /stores:
    post:
      tags: [identity]
      operationId: createStore
      security: [{ bearerAuth: ["identity:admin"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Store' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: STORE_ALREADY_EXISTS, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      tags: [identity]
      operationId: listStores
      security: [{ bearerAuth: ["identity:admin"] }]
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Store' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /stores/{code}:
    patch:
      tags: [identity]
      operationId: updateStore
      security: [{ bearerAuth: ["identity:admin"] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreUpdate' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Store' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: STORE_IN_USE, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /arrivals:
    get:
      tags: [traceability]
      operationId: listStoreArrivals
      summary: Search registered arrivals visible to the current store
      security: [{ bearerAuth: ["catalog:read"] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: store_code, in: query, schema: { type: string }, description: "Admin-only cross-store filter; operators are forced to their JWT store_code" }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Limit'
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogPage' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /arrivals/{batch_id}/image:
    get:
      tags: [traceability]
      operationId: getStoreArrivalImage
      summary: Read the persisted source photo for a visible arrival
      security: [{ bearerAuth: ["catalog:read"] }]
      parameters:
        - { name: batch_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Source photo
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            image/heic: {}
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /arrivals/{batch_id}:
    get:
      tags: [traceability]
      operationId: getStoreArrival
      summary: Read the current 17-field projection for a visible arrival
      security: [{ bearerAuth: ["catalog:read"] }]
      parameters:
        - { name: batch_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogArrival' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Capability 1: Label ingestion -------------------------------------------------
  /ingestions:
    post:
      tags: [ingestion]
      operationId: submitCapture
      security: [{ bearerAuth: ["ingestion:write"] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CaptureSubmit' }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/IngestionAccepted' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/IngestionAccepted' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    get:
      tags: [ingestion]
      operationId: listIngestions
      security: [{ bearerAuth: ["ingestion:read"] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/IngestionStatus' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IngestionPage' } } } }

  /ingestions/{id}:
    get:
      tags: [ingestion]
      operationId: getIngestion
      security: [{ bearerAuth: ["ingestion:read"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Ingestion' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /ingestions/{id}/image:
    get:
      tags: [ingestion]
      operationId: getIngestionImage
      security: [{ bearerAuth: ["ingestion:read"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '302': { description: Redirect to short-lived signed object-store URL }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Capability 2 & 3: OCR / extraction persistence + status -----------------------
  /ingestions/{id}/extract:
    post:
      tags: [ingestion]
      operationId: runExtraction
      security: [{ bearerAuth: ["extraction:run"] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: Extraction enqueued (new ExtractionRun) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IngestionInvalidState' }

  /ingestions/{id}/extraction:
    get:
      tags: [ingestion]
      operationId: getExtraction
      security: [{ bearerAuth: ["ingestion:read"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractionView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ExtractionNotReady' }

  /ingestions/{id}/extraction/runs:
    get:
      tags: [ingestion]
      operationId: listExtractionRuns
      security: [{ bearerAuth: ["ingestion:read"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExtractionRunSummary' } } } } }

  /ingestions/{id}/ocr:
    get:
      tags: [ingestion]
      operationId: getOcrResult
      security: [{ bearerAuth: ["ingestion:read"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OcrSummary' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Capability 4: validation / review workflow ------------------------------------
  /ingestions/{id}/fields/{field_name}:
    patch:
      tags: [ingestion]
      operationId: overrideField
      security: [{ bearerAuth: ["extraction:review"] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: field_name, in: path, required: true, schema: { $ref: '#/components/schemas/FieldName' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [value], properties: { value: {}, note: { type: string }, force_gs1: { type: boolean, default: false, description: "Required to override a GS1-owned field (batch_number/expiry_date/weight/gtin/packaging_date); without it those fields return 409 FIELD_NOT_EDITABLE" } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractedField' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IngestionInvalidState' }

  /ingestions/{id}/reviews:
    post:
      tags: [ingestion]
      operationId: finalizeReview
      summary: Atomically append the complete human revision and confirm ingestion
      security: [{ bearerAuth: ["extraction:review"] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizeReviewRequest' }
      responses:
        '200': { description: Finalized or idempotently replayed, content: { application/json: { schema: { $ref: '#/components/schemas/FinalizeReviewResult' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /ingestions/{id}/confirm:
    post:
      tags: [ingestion]
      operationId: confirmExtraction
      security: [{ bearerAuth: ["extraction:confirm"] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } }
      responses:
        '200': { description: Confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IngestionInvalidState' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /ingestions/{id}/reject:
    post:
      tags: [ingestion]
      operationId: rejectExtraction
      security: [{ bearerAuth: ["extraction:confirm"] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } }
      responses:
        '200': { description: Rejected }
        '409': { $ref: '#/components/responses/IngestionInvalidState' }

  # ---- Capability 5: batch/lot creation ----------------------------------------------
  /batches:
    post:
      tags: [traceability]
      operationId: createBatch
      security: [{ bearerAuth: ["batch:write"] }]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BatchCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Batch' } } } }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [traceability]
      operationId: listBatches
      security: [{ bearerAuth: ["traceability:read"] }]
      parameters:
        - { name: species,  in: query, schema: { type: string } }
        - { name: lot_code, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BatchPage' } } } }

  /batches/{id}:
    get:
      tags: [traceability]
      operationId: getBatch
      security: [{ bearerAuth: ["traceability:read"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Batch' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Capability 6: supplier management ---------------------------------------------
  /suppliers:
    post:
      tags: [traceability]
      operationId: createSupplier
      security: [{ bearerAuth: ["supplier:write"] }]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Supplier' } } } }
    get:
      tags: [traceability]
      operationId: listSuppliers
      security: [{ bearerAuth: ["traceability:read"] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierPage' } } } }

  /suppliers/{id}:
    get:
      tags: [traceability]
      operationId: getSupplier
      security: [{ bearerAuth: ["traceability:read"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Supplier' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [traceability]
      operationId: updateSupplier
      security: [{ bearerAuth: ["supplier:write"] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierCreate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Supplier' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [traceability]
      operationId: deactivateSupplier
      security: [{ bearerAuth: ["supplier:admin"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: Deactivated (soft) } }

  # ---- Capability 7: traceability lookup ---------------------------------------------
  /trace:
    get:
      tags: [traceability]
      operationId: traceLookup
      security: [{ bearerAuth: ["traceability:read"] }]
      parameters:
        - { name: lot_code,    in: query, schema: { type: string } }
        - { name: gtin,        in: query, schema: { type: string } }
        - { name: supplier_id, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TracePage' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /trace/by-lot/{lot_code}:
    get:
      tags: [traceability]
      operationId: traceByLot
      security: [{ bearerAuth: ["traceability:read"] }]
      parameters: [ { name: lot_code, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TracePage' } } } }

  /trace/by-batch/{batch_id}:
    get:
      tags: [traceability]
      operationId: traceByBatch
      security: [{ bearerAuth: ["traceability:read"] }]
      parameters: [ { name: batch_id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TraceItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Capability 8: temperature logging ---------------------------------------------
  /temperature-logs:
    post:
      tags: [haccp]
      operationId: logTemperature
      security: [{ bearerAuth: ["temperature:write"] }]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TemperatureLogCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TemperatureLog' } } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [haccp]
      operationId: listTemperatureLogs
      security: [{ bearerAuth: ["haccp:read"] }]
      parameters:
        - { name: location, in: query, schema: { type: string } }
        - { name: batch_id, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TemperatureLogPage' } } } }

  # ---- Capability 9: alerts ----------------------------------------------------------
  /alerts:
    get:
      tags: [haccp]
      operationId: listAlerts
      security: [{ bearerAuth: ["haccp:read"] }]
      parameters:
        - { name: state,    in: query, schema: { type: string, enum: [open, acknowledged, resolved] } }
        - { name: severity, in: query, schema: { type: string, enum: [low, medium, high, critical] } }
        - { name: type,     in: query, schema: { type: string, enum: [expiry, temperature, required_field] } }
        - { name: batch_id, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AlertPage' } } } }

  /alerts/{id}:
    get:
      tags: [haccp]
      operationId: getAlert
      security: [{ bearerAuth: ["haccp:read"] }]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /alerts/{id}/acknowledge:
    post:
      tags: [haccp]
      operationId: acknowledgeAlert
      security: [{ bearerAuth: ["alert:ack"] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }
        '409': { $ref: '#/components/responses/AlertInvalidTransition' }

  /alerts/{id}/resolve:
    post:
      tags: [haccp]
      operationId: resolveAlert
      security: [{ bearerAuth: ["alert:resolve"] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }
        '409': { $ref: '#/components/responses/AlertInvalidTransition' }

  # ---- Capability 10: audit (read-only) ----------------------------------------------
  /audit:
    get:
      tags: [audit]
      operationId: queryAudit
      security: [{ bearerAuth: ["audit:read"] }]
      parameters:
        - { name: actor_id,       in: query, schema: { type: string } }
        - { name: action,         in: query, schema: { type: string } }
        - { name: subject_ref,    in: query, schema: { type: string } }
        - { name: correlation_id, in: query, schema: { type: string } }
        - { name: from,           in: query, schema: { type: string, format: date-time } }
        - { name: to,             in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }

  /audit/{entry_id}:
    get:
      tags: [audit]
      operationId: getAuditEntry
      security: [{ bearerAuth: ["audit:read"] }]
      parameters: [ { name: entry_id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEntry' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- ops ---------------------------------------------------------------------------
  /health/live:  { get: { tags: [ops], operationId: live,    security: [], responses: { '200': { description: alive } } } }
  /health/ready: { get: { tags: [ops], operationId: ready,   security: [], responses: { '200': { description: ready }, '503': { $ref: '#/components/responses/DependencyUnavailable' } } } }
  /version:      { get: { tags: [ops], operationId: version, security: [], responses: { '200': { description: OK } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Local HS256 JWT with tenant, store, role and scopes claims.

  parameters:
    Id:             { name: id, in: path, required: true, schema: { type: string } }
    Limit:          { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
    Cursor:         { name: cursor, in: query, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    CorrelationId:  { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }

  responses:
    Unauthenticated:        { description: Unauthenticated,        content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden:              { description: Forbidden,              content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound:               { description: Not found,              content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    IdempotencyConflict:    { description: Idempotency conflict,   content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PayloadTooLarge:        { description: Payload too large,      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    UnsupportedMediaType:   { description: Unsupported media type, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ValidationFailed:       { description: Validation failed,      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    RateLimited:            { description: Rate limited,           headers: { Retry-After: { schema: { type: integer } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    DependencyUnavailable:  { description: Dependency unavailable, headers: { Retry-After: { schema: { type: integer } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionFailed:     { description: ETag precondition failed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    IngestionInvalidState:  { description: Invalid ingestion state, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ExtractionNotReady:     { description: Extraction not ready,   content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    AlertInvalidTransition: { description: Invalid alert transition, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  schemas:
    # ---- shared ----
    Problem:
      type: object
      required: [type, title, status, error_code, correlation_id, timestamp, retriable]
      properties:
        type:           { type: string, format: uri }
        title:          { type: string }
        status:         { type: integer }
        detail:         { type: string }
        error_code:     { type: string }
        correlation_id: { type: string }
        trace_id:       { type: string }
        timestamp:      { type: string, format: date-time }
        retriable:      { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties: { field: { type: string }, code: { type: string }, message: { type: string } }
    # ---- identity ----
    UserRole:
      type: string
      enum: [admin, operator]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, format: password }
    CurrentUser:
      type: object
      required: [id, username, display_name, role, organization_id, organization_slug, store_id, store_code]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        organization_id: { type: string, format: uuid }
        organization_slug: { type: string }
        store_id: { type: [string, "null"], format: uuid }
        store_code: { type: [string, "null"] }
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer, minimum: 1 }
        user: { $ref: '#/components/schemas/CurrentUser' }
    User:
      allOf:
        - $ref: '#/components/schemas/CurrentUser'
        - type: object
          required: [active, created_by, created_at, updated_at]
          properties:
            active: { type: boolean }
            created_by: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [username, display_name, password]
      properties:
        username: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 1, format: password, writeOnly: true }
        role: { $ref: '#/components/schemas/UserRole', default: operator }
        store_code: { type: [string, "null"], description: "Required when role=operator" }
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 1, format: password, writeOnly: true }
        role: { $ref: '#/components/schemas/UserRole' }
        active: { type: boolean }
        store_code: { type: [string, "null"] }
    UserPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }
    Store:
      type: object
      required: [id, code, name, active, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        active: { type: boolean }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StoreCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        name: { type: string, minLength: 1 }
    StoreUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        active: { type: boolean }
    CatalogProduct:
      type: object
      required: [batch_id, store_code, product_name, scientific_name, gtin, lot_code, supplier_name, status, fao_area_code, production_method, use_by, packaging_date, recorded_at, photo_available]
      properties:
        batch_id: { type: string, format: uuid }
        store_code: { type: [string, "null"] }
        product_name: { type: [string, "null"] }
        scientific_name: { type: [string, "null"] }
        gtin: { type: [string, "null"] }
        lot_code: { type: string }
        supplier_name: { type: [string, "null"] }
        status: { type: string, enum: [registered] }
        fao_area_code: { type: [string, "null"] }
        production_method: { type: [string, "null"], enum: [wild_caught, farmed, null] }
        use_by: { type: [string, "null"], format: date }
        packaging_date: { type: [string, "null"], format: date }
        recorded_at: { type: string, format: date-time }
        photo_available: { type: boolean }
    CatalogPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogProduct' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
        offset: { type: integer, minimum: 0 }
    CatalogArrival:
      type: object
      required: [batch_id, ingestion_id, store_code, status, fields, validation, revision_no, recorded_at, updated_at, photo_available]
      properties:
        batch_id: { type: string, format: uuid }
        ingestion_id: { type: string, format: uuid }
        store_code: { type: [string, "null"] }
        status: { type: string }
        fields:
          type: object
          propertyNames: { $ref: '#/components/schemas/FieldName' }
          additionalProperties: { type: [string, "null"] }
        validation: { type: object, additionalProperties: { type: object } }
        revision_no: { type: integer, minimum: 1 }
        recorded_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        photo_available: { type: boolean }
    # D4: score == extracted_field.combined_confidence; band == extracted_field.confidence_band.
    Confidence:
      type: object
      required: [score, band]
      properties:
        score: { type: number, minimum: 0, maximum: 1, description: "Read-model projection of extracted_field.combined_confidence" }
        band:  { type: string, enum: [low, medium, high], description: "Read-model projection of extracted_field.confidence_band" }
    # D3: a STORED value can only be labelled by the LLM or a human reviewer; ocr/barcode never label a stored field value (matches extracted_field.source CHECK).
    Provenance:
      type: object
      required: [source]
      properties:
        source:            { type: string, enum: [llm, human] }
        extractor_version: { type: string, nullable: true }
        source_ref:        { type: string, nullable: true, description: "Pointer into the immutable raw OCR (token span); null if unverifiable. Equivalent to extracted_field.evidence." }
    # D1: the v2 canonical field names (prompt v2.0.0). raw_warnings is a label-level stub on extraction_run, not a per-field name. Legacy product_name/supplier_name kept for immutable historical rows (migration 0011 superset).
    FieldName:
      type: string
      enum: [commercial_designation, scientific_name, producer_name, reseller_brand, batch_number, origin_country, FAO_area, production_method, fishing_gear_or_farming_method, expiry_date, packaging_date, storage_temperature, allergens, health_mark, weight, price, gtin, product_name, supplier_name]
    # D2: validation_status and per-field warnings are persisted (extracted_field) and must appear in the read model so it is a faithful projection.
    ExtractedField:
      type: object
      required: [name, value, confidence, provenance, validation_status]
      properties:
        name:              { $ref: '#/components/schemas/FieldName' }
        value:             { nullable: true, description: "null when absent/unreadable; NEVER fabricated" }
        confidence:        { $ref: '#/components/schemas/Confidence' }
        provenance:        { $ref: '#/components/schemas/Provenance' }
        validation_status: { type: string, enum: [present, missing, ambiguous, normalized, unnormalizable, invalid] }
        warnings:          { type: array, items: { type: string } }
        reason:            { type: string, nullable: true, enum: [not_found, unreadable, unverifiable] }

    # ---- ingestion ----
    # D7: authoritative 12-state machine (schema.sql ingestion CHECK == shared-state.schema.json). This was an 8-state public projection.
    IngestionStatus: { type: string, enum: [raw_stored, ocr_running, ocr_done, ocr_failed, ocr_skipped_garbage, extraction_running, extracted, extraction_failed, needs_review, confirmed, rejected, halted_missing_context] }
    CaptureSubmit:
      type: object
      required: [image]
      properties:
        image: { type: string, format: binary }
        meta:
          type: object
          properties:
            barcode_raw:        { type: string, nullable: true }
            client_captured_at: { type: string, format: date-time, nullable: true }
            client_meta:        { type: object, additionalProperties: true }
    IngestionAccepted:
      type: object
      required: [ingestion_id, status, image_ref, checksum, server_received_at, correlation_id]
      properties:
        ingestion_id:       { type: string }
        status:             { $ref: '#/components/schemas/IngestionStatus' }
        image_ref:          { type: string }
        checksum:           { type: string }
        server_received_at: { type: string, format: date-time }
        correlation_id:     { type: string }
    Ingestion:
      type: object
      properties:
        ingestion_id:       { type: string }
        status:             { $ref: '#/components/schemas/IngestionStatus' }
        image_ref:          { type: string }
        checksum:           { type: string }
        barcode_raw:        { type: string, nullable: true }
        server_received_at: { type: string, format: date-time }
        client_captured_at: { type: string, format: date-time, nullable: true }
        batch_id:           { type: string, nullable: true }
    IngestionPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Ingestion' } }
        next_cursor: { type: string, nullable: true }
    ExtractionView:
      type: object
      properties:
        ingestion_id:            { type: string }
        status:                  { $ref: '#/components/schemas/IngestionStatus' }
        extractor_version:       { type: string }
        fields:                  { type: array, items: { $ref: '#/components/schemas/ExtractedField' } }
        missing_required_fields: { type: array, items: { $ref: '#/components/schemas/FieldName' } }
        low_confidence_fields:   { type: array, items: { $ref: '#/components/schemas/FieldName' } }
    ExtractionRunSummary:
      type: object
      properties:
        run_id:            { type: string }
        extractor_version: { type: string }
        ocr_raw_ref:       { type: string }
        outcome:           { type: string, enum: [extraction_running, extracted, needs_review, extraction_failed, unparseable, off_schema, refused] }
        created_at:        { type: string, format: date-time }
    OcrSummary:
      type: object
      properties:
        ocr_raw_ref:           { type: string }
        token_count:           { type: integer }
        mean_token_confidence: { type: number }
    ConfirmResult:
      type: object
      properties:
        ingestion_id: { type: string }
        status:       { type: string, enum: [confirmed] }
        batch_id:     { type: string, nullable: true }
    FinalizeReviewRequest:
      type: object
      required: [fields]
      properties:
        fields:
          type: object
          description: Exactly the 17 canonical v2 fields.
          minProperties: 17
          maxProperties: 17
          propertyNames: { $ref: '#/components/schemas/FieldName' }
          additionalProperties: { type: [string, "null"] }
        note: { type: [string, "null"] }
    FinalizeReviewResult:
      type: object
      required: [ingestion_id, run_id, status, replayed]
      properties:
        ingestion_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        status: { type: string, const: confirmed }
        replayed: { type: boolean }

    # ---- traceability ----
    # D5/D6: production_method enum matches batch CHECK (wild_caught|farmed); gear_type dropped (no backing column on batch — gear is only surfaced via the extraction view); scientific_name maps to batch.species_scientific; species (common name) resolves to a product, it is not a batch column.
    BatchCreate:
      type: object
      required: [lot_code, species]
      properties:
        lot_code:            { type: string }
        gtin:                { type: string, nullable: true }
        species:             { type: string, description: "Common species name; resolves/links a traceability.product — not stored directly on batch" }
        scientific_name:     { type: string, nullable: true, description: "Maps to batch.species_scientific (denormalized snapshot at confirm)" }
        fao_area:            { type: string, nullable: true, description: "Maps to batch.fao_area_code" }
        production_method:   { type: string, nullable: true, enum: [wild_caught, farmed] }
        use_by:              { type: string, format: date, nullable: true }
        supplier_id:         { type: string, nullable: true }
        source_ingestion_id: { type: string, nullable: true }
    Batch:
      allOf:
        - $ref: '#/components/schemas/BatchCreate'
        - type: object
          properties:
            batch_id:   { type: string }
            created_at: { type: string, format: date-time }
    BatchPage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Batch' } }, next_cursor: { type: string, nullable: true } }
    SupplierCreate:
      type: object
      required: [name]
      properties:
        name:            { type: string }
        approval_number: { type: string, nullable: true }
    Supplier:
      allOf:
        - $ref: '#/components/schemas/SupplierCreate'
        - type: object
          properties:
            id:     { type: string }
            active: { type: boolean }
            etag:   { type: string }
    SupplierPage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Supplier' } }, next_cursor: { type: string, nullable: true } }
    TraceItem:
      type: object
      properties:
        batch_id:            { type: string }
        lot_code:            { type: string }
        gtin:                { type: string, nullable: true }
        species:             { type: string }
        fao_area:            { type: string, nullable: true }
        use_by:              { type: string, format: date, nullable: true }
        supplier:            { $ref: '#/components/schemas/Supplier' }
        source_ingestion_id: { type: string }
        alerts:              { type: array, items: { $ref: '#/components/schemas/AlertSummary' } }
    TracePage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/TraceItem' } }, next_cursor: { type: string, nullable: true } }

    # ---- haccp ----
    TemperatureLogCreate:
      type: object
      required: [location, temp_c, measured_at]
      properties:
        location:    { type: string }
        temp_c:      { type: number, minimum: -50, maximum: 60 }
        measured_at: { type: string, format: date-time }
        batch_id:    { type: string, nullable: true }
        source:      { type: string, enum: [manual, sensor], default: manual }
    TemperatureLog:
      allOf:
        - $ref: '#/components/schemas/TemperatureLogCreate'
        - type: object
          properties:
            id:           { type: string }
            recorded_at:  { type: string, format: date-time, description: "Server time (Clock)" }
    TemperatureLogPage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/TemperatureLog' } }, next_cursor: { type: string, nullable: true } }
    AlertSummary:
      type: object
      properties:
        alert_id: { type: string }
        type:     { type: string, enum: [expiry, temperature, required_field] }
        severity: { type: string, enum: [low, medium, high, critical] }
        state:    { type: string, enum: [open, acknowledged, resolved] }
    Alert:
      allOf:
        - $ref: '#/components/schemas/AlertSummary'
        - type: object
          properties:
            batch_id:              { type: string, nullable: true }
            control_plan_version:  { type: string }
            raised_at:             { type: string, format: date-time }
            acknowledged_by:       { type: string, nullable: true }
            resolved_by:           { type: string, nullable: true }
            note:                  { type: string, nullable: true }
    AlertPage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Alert' } }, next_cursor: { type: string, nullable: true } }

    # ---- audit ----
    AuditEntry:
      type: object
      properties:
        entry_id:       { type: string }
        action:         { type: string }
        actor:          { type: object, properties: { id: { type: string }, role: { type: string } } }
        subject_ref:    { type: string }
        before_ref:     { type: string, nullable: true }
        after_ref:      { type: string, nullable: true }
        occurred_at:    { type: string, format: date-time }
        correlation_id: { type: string }
        trace_id:       { type: string }
    AuditPage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }, next_cursor: { type: string, nullable: true } }
