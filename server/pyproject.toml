[project]
name = "labelscan-server"
version = "0.0.1"
description = "LabelScan — HACCP seafood traceability backend (modular monolith). PG-0/PG-1 foundations."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pyjwt>=2.8",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
    "ruff>=0.6",
]

# src layout: the importable package is `labelscan` under src/.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

# --- Ruff: general lint + a coarse safety net banning provider/framework imports anywhere
#     they have no business. The authoritative boundary check is import-linter (G-ARCH). ---
[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
