name: security-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tracked-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Reject tracked credentials and private keys
        run: node scripts/check-tracked-secrets.mjs
