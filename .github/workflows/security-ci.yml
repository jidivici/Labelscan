name: security-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tracked-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject tracked credentials and private keys
        run: node scripts/check-tracked-secrets.mjs
