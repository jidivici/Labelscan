name: deploy-hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_demo:
        description: "Type RESET_DEMO to delete all current LabelScan data and seed the demo dataset"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: labelscan-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy production]')
    name: Deploy private VPS
    runs-on: [self-hosted, linux, x64, labelscan-production]
    environment:
      name: production
      url: https://label-scan.fr
    timeout-minutes: 30

    steps:
      - name: Check out the exact revision
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" reset --hard
          git -C "$GITHUB_WORKSPACE" clean -ffd
          git -C "$GITHUB_WORKSPACE" remote remove origin || true
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${CHECKOUT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}"

      - name: Verify deployment source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git remote get-url origin)" = "https://github.com/${GITHUB_REPOSITORY}"
          test -f server/Dockerfile
          test -f web/package-lock.json

      - name: Deploy with backup and health check
        shell: bash
        env:
          RESET_DEMO: ${{ inputs.reset_demo }}
        run: |
          set -Eeuo pipefail
          test -x "$GITHUB_WORKSPACE/deploy/hostinger/deploy.sh"
          if [[ -z "$RESET_DEMO" ]]; then
            sudo --non-interactive "$GITHUB_WORKSPACE/deploy/hostinger/deploy.sh" "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          elif [[ "$RESET_DEMO" == "RESET_DEMO" ]]; then
            sudo --non-interactive "$GITHUB_WORKSPACE/deploy/hostinger/deploy.sh" "$GITHUB_WORKSPACE" "$GITHUB_SHA" --reset-demo
          else
            echo "reset_demo must be empty or exactly RESET_DEMO" >&2
            exit 1
          fi
