name: deploy-hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_demo:
        description: "Type RESET_DEMO to delete all current LabelScan data and seed the demo dataset"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: labelscan-production
  cancel-in-progress: false

jobs:
  release-gate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy production]')
    name: Revalidate exact production revision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labelscan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/labelscan_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Mobile quality and zero-vulnerability gate
        run: |
          npm ci
          npm run check:android13
          npm run typecheck
          npm test -- --runInBand
          node scripts/check-npm-audit.mjs

      - name: Backoffice quality and zero-vulnerability gate
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm audit

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.lock

      - name: Backend quality and zero-vulnerability gate
        working-directory: server
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          pip-audit --no-deps --disable-pip -r requirements.lock
          pip-audit --no-deps --disable-pip -r requirements-dev.lock
          lint-imports
          ruff check .
          python scripts/export_openapi.py --check
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          pytest -q

      - name: Production artifact and deployment-contract gate
        run: |
          docker build --build-arg LABELSCAN_VERSION="$GITHUB_SHA" -f server/Dockerfile -t "labelscan-local:${GITHUB_SHA}" .
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "labelscan-local:${GITHUB_SHA}")" = "$GITHUB_SHA"
          docker run --rm \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock,readonly \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --quiet --sbom-sources= --scanners vuln --exit-code 1 \
            "labelscan-local:${GITHUB_SHA}"
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          LABELSCAN_VERSION="$GITHUB_SHA" docker compose -f deploy/compose/single-vps.yml config --quiet
          bash -n deploy/hostinger/deploy.sh

  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy production]')
    needs: release-gate
    name: Deploy private VPS
    runs-on: [self-hosted, linux, x64, labelscan-production]
    environment:
      name: production
      url: https://label-scan.fr
    timeout-minutes: 30

    steps:
      - name: Check out the exact revision without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deployment source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git remote get-url origin)" = "https://github.com/${GITHUB_REPOSITORY}"
          test -f server/Dockerfile
          test -f web/package-lock.json

      - name: Deploy with backup and health check
        shell: bash
        env:
          RESET_DEMO: ${{ inputs.reset_demo }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$RESET_DEMO" ]]; then
            sudo --non-interactive /usr/local/sbin/labelscan-deploy "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          elif [[ "$RESET_DEMO" == "RESET_DEMO" ]]; then
            sudo --non-interactive /usr/local/sbin/labelscan-deploy "$GITHUB_WORKSPACE" "$GITHUB_SHA" --reset-demo
          else
            echo "reset_demo must be empty or exactly RESET_DEMO" >&2
            exit 1
          fi
