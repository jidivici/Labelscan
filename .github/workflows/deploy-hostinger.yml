name: deploy-hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_demo:
        description: "Type RESET_DEMO to delete all current LabelScan data and seed the demo dataset"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: labelscan-production
  cancel-in-progress: false

jobs:
  release-gate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy production]')
    name: Revalidate exact production revision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/labelscan_test

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Build and start the hardened test database
        run: |
          docker build --pull --no-cache --build-arg LABELSCAN_VERSION="$GITHUB_SHA" \
            -f deploy/postgres/Dockerfile -t "labelscan-postgres:${GITHUB_SHA}" .
          docker run -d --name labelscan-test-postgres \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=labelscan_test \
            "labelscan-postgres:${GITHUB_SHA}"
          for attempt in $(seq 1 60); do
            if docker exec labelscan-test-postgres pg_isready -U postgres -d labelscan_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs labelscan-test-postgres
          exit 1

      - name: Mobile quality and zero-vulnerability gate
        run: |
          npm ci
          npm run check:android13
          npm run typecheck
          npm test -- --runInBand
          node scripts/check-npm-audit.mjs

      - name: Backoffice quality and zero-vulnerability gate
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm audit

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.lock

      - name: Backend quality and zero-vulnerability gate
        working-directory: server
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          pip-audit --no-deps --disable-pip -r requirements.lock
          pip-audit --no-deps --disable-pip -r requirements-dev.lock
          lint-imports
          ruff check .
          python scripts/export_openapi.py --check
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          pytest -q

      - name: Production artifact and deployment-contract gate
        run: |
          docker build --pull --no-cache --build-arg LABELSCAN_VERSION="$GITHUB_SHA" -f server/Dockerfile -t "labelscan-local:${GITHUB_SHA}" .
          docker build --pull --no-cache --build-arg LABELSCAN_VERSION="$GITHUB_SHA" -f deploy/caddy/Dockerfile -t "labelscan-caddy:${GITHUB_SHA}" .
          for image_name in labelscan-local labelscan-caddy labelscan-postgres; do
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image_name}:${GITHUB_SHA}")" = "$GITHUB_SHA"
          done
          deploy/postgres/test-volume-compatibility.sh "labelscan-postgres:${GITHUB_SHA}"
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          for image_name in labelscan-local labelscan-caddy labelscan-postgres; do
            docker save -o "$RUNNER_TEMP/${image_name}.tar" "${image_name}:${GITHUB_SHA}"
            trivy_args=(
              image --input "/scan/${image_name}.tar" --cache-dir /scan/trivy-cache
              --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
              --exit-code 1 --no-progress --skip-version-check --show-suppressed
            )
            if [[ "$image_name" == labelscan-caddy ]]; then
              trivy_args+=(--vex /vex/GO-2026-5932.openvex.json)
            fi
            docker run --rm -v "$RUNNER_TEMP:/scan" \
              -v "$GITHUB_WORKSPACE/deploy/caddy:/vex:ro" \
              aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
              "${trivy_args[@]}"
          done
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            config --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 1 --skip-version-check /workspace/deploy
          docker run --rm --network none --user 10002:10002 --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "labelscan-caddy:${GITHUB_SHA}" \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile
          LABELSCAN_VERSION="$GITHUB_SHA" docker compose \
            -f deploy/compose/single-vps.yml \
            -f deploy/compose/single-vps.build.yml \
            config --quiet
          bash -n deploy/hostinger/deploy.sh

  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy production]')
    needs: release-gate
    name: Deploy private VPS
    runs-on: [self-hosted, linux, x64, labelscan-production]
    environment:
      name: production
      url: https://label-scan.fr
    timeout-minutes: 30

    steps:
      - name: Check out the exact revision without persisting credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deployment source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git remote get-url origin)" = "https://github.com/${GITHUB_REPOSITORY}"
          test -f server/Dockerfile
          test -f web/package-lock.json

      - name: Deploy with backup and health check
        shell: bash
        env:
          RESET_DEMO: ${{ inputs.reset_demo }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$RESET_DEMO" ]]; then
            sudo --non-interactive /usr/local/sbin/labelscan-deploy "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          elif [[ "$RESET_DEMO" == "RESET_DEMO" ]]; then
            sudo --non-interactive /usr/local/sbin/labelscan-deploy "$GITHUB_WORKSPACE" "$GITHUB_SHA" --reset-demo
          else
            echo "reset_demo must be empty or exactly RESET_DEMO" >&2
            exit 1
          fi
