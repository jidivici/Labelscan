name: backend-ci

# PG-0 + PG-1 gates. Runs on every push/PR touching the backend.
on:
  push:
    paths: ["server/**", "deploy/**", "docs/backend/openapi.v1.yaml", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["server/**", "deploy/**", "docs/backend/openapi.v1.yaml", ".github/workflows/backend-ci.yml"]

jobs:
  foundations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16.15@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labelscan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/labelscan_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Dependency audit
        # requirements.lock is a complete, transitively resolved and hashed graph;
        # audit it directly instead of executing pip in a temporary environment.
        run: pip-audit --no-deps --disable-pip -r requirements.lock

      - name: Development dependency audit
        run: pip-audit --no-deps --disable-pip -r requirements-dev.lock

      # G-ARCH — dependency-boundary enforcement (PG-0). Fails the build on any
      # layering / context-independence / domain-purity violation.
      - name: G-ARCH (import-linter)
        run: lint-imports

      - name: Lint (ruff)
        run: ruff check .

      - name: API inventory is current
        run: python scripts/export_openapi.py --check

      # G-MIG — migrations must apply AND be reversible (expand-and-contract).
      - name: Migrate up
        run: alembic upgrade head
      - name: Migrate down (reversibility)
        run: alembic downgrade base
      - name: Migrate up again
        run: alembic upgrade head

      # PG-1 proofs — immutability / same-transaction audit / rollback.
      - name: Proofs
        run: pytest -v

  production-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build -f server/Dockerfile -t labelscan:ci .
      - name: Validate production Compose contract
        env:
          LABELSCAN_IMAGE: registry.example/labelscan@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          LABELSCAN_EDGE_NETWORK: labelscan_edge
          LABELSCAN_BACKEND_NETWORK: labelscan_backend
          LABELSCAN_VERSION: ci-test-sha
          LABELSCAN_PUBLIC_ORIGIN: https://labelscan.example
          LABELSCAN_ALLOWED_HOSTS: labelscan.example
          LABELSCAN_TRUSTED_PROXIES: 172.20.0.10
          LABELSCAN_JWT_ISSUER: https://labelscan.example
          LABELSCAN_JWT_AUDIENCE: labelscan-clients
          LABELSCAN_S3_BUCKET: labelscan-production
          LABELSCAN_S3_REGION: eu-west-3
          LABELSCAN_S3_KMS_KEY_ID: test-config-key
        run: docker compose -f deploy/compose/production.yml config --quiet
      - name: Validate Hostinger single-VPS contract
        env:
          LABELSCAN_VERSION: ci-test-sha
        run: docker compose -f deploy/compose/single-vps.yml config --quiet
