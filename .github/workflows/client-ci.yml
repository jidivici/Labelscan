name: client-ci

on:
  push:
    paths: ["src/**", "App.tsx", "index.ts", "app.json", "app.config.js", "eas.json", "tsconfig.json", "package.json", "package-lock.json", "web/**", "security/**", "scripts/check-npm-audit.mjs", "scripts/check-android-8.mjs", ".github/workflows/client-ci.yml"]
  pull_request:
    paths: ["src/**", "App.tsx", "index.ts", "app.json", "app.config.js", "eas.json", "tsconfig.json", "package.json", "package-lock.json", "web/**", "security/**", "scripts/check-npm-audit.mjs", "scripts/check-android-8.mjs", ".github/workflows/client-ci.yml"]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:android8
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: node scripts/check-npm-audit.mjs security/npm-audit-allowlist.json

  backoffice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backoffice-playwright-failures
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
