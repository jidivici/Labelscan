name: client-ci

on:
  push:
    paths: ["src/**", "App.tsx", "index.ts", "app.json", "app.config.js", "eas.json", "tsconfig.json", "package.json", "package-lock.json", "web/**", "security/**", "scripts/check-npm-audit.mjs", "scripts/check-android-13.mjs", ".github/workflows/client-ci.yml"]
  pull_request:
    paths: ["src/**", "App.tsx", "index.ts", "app.json", "app.config.js", "eas.json", "tsconfig.json", "package.json", "package-lock.json", "web/**", "security/**", "scripts/check-npm-audit.mjs", "scripts/check-android-13.mjs", ".github/workflows/client-ci.yml"]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:android13
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: node scripts/check-npm-audit.mjs

  backoffice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: backoffice-playwright-failures
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
