services:
  db:
    image: postgres:16
    container_name: labelscan-db
    environment:
      POSTGRES_DB: labelscan_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - labelscan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labelscan_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: labelscan-server
    env_file: ./server/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/labelscan_test"
      LABELSCAN_OBJECT_STORE: "filesystem"
      LABELSCAN_RAW_STORE_DIR: "/app/data/raw"
    volumes:
      - labelscan-raw-store:/app/data/raw
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/app/entrypoint.sh"]

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    # No container_name: replicas need unique names. Running N workers is safe — the
    # outbox claim uses FOR UPDATE SKIP LOCKED (audit §1.5) — and each replica keeps its
    # OWN heartbeat file, so the per-container healthcheck stays correct.
    deploy:
      replicas: 2
    env_file: ./server/.env
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/labelscan_test"
      LABELSCAN_OBJECT_STORE: "filesystem"
      LABELSCAN_RAW_STORE_DIR: "/app/data/raw"
    volumes:
      - labelscan-raw-store:/app/data/raw
    depends_on:
      db:
        condition: service_healthy
    # Remplacer "command:" par "entrypoint:" pour contourner l'entrypoint.sh par défaut
    entrypoint: [ "python", "-m", "labelscan.app.worker_runtime" ]
    # Liveness: the worker refreshes a heartbeat file each poll loop...
    healthcheck:
      test: [ "CMD", "python", "-m", "labelscan.app.worker_runtime", "--health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


volumes:
  labelscan-pgdata:
  labelscan-raw-store:
